# Alembic configuration. Drives schema migrations per §6.2.
# The sqlalchemy.url here is a placeholder — env.py overrides it from
# `mixsight.config.get_settings().DATABASE_URL` so the real URL stays in .env.

[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
sqlalchemy.url = postgresql+asyncpg://placeholder/placeholder

[post_write_hooks]
# Run ruff format on every generated migration so they match the project style.
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
